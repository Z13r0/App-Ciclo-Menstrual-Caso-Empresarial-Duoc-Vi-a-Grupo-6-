org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# no poner org.gradle.java.home aca: esa ruta es distinta en el pc de cada uno
# y si no existe gradle no arranca. gradle usa la variable JAVA_HOME del sistema
# y la version para compilar ya esta fijada con jvmToolchain(17) en app/build.gradle.kts
# si tu java por defecto no es 17 a 22, pon la ruta en TU archivo personal:
# C:\Users\<tu usuario>\.gradle\gradle.properties
